name: Extension Tag Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-draft:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout extension repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Checkout spm-vscode intellisense repository
      uses: actions/checkout@v4
      with:
        repository: spm-ecosystem/spm-vscode
        path: ../vscode-theme-manifest-intellisense

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies in extension
      run: npm ci

    - name: Install dependencies in spm-vscode
      run: |
        cd ../vscode-theme-manifest-intellisense
        npm ci
        cd -

    - name: Build Extension (regenerates registry & VS Code schema)
      run: npm run build

    - name: Package extension to ZIP
      run: |
        cd dist
        zip -r ../spm-extension-${{ github.ref_name }}.zip .
        cd ..

    - name: Create GitHub Release Draft
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: spm-extension-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
